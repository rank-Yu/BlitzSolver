name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Build, contracts and simulation regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Sts2Solver.sln -c Release
      - run: dotnet run --project tests/KernelChecks -c Release --no-build
      - run: dotnet run --project tests/Architecture -c Release --no-build
      - run: dotnet run --project tests/Golden -c Release --no-build -- k0
      - run: dotnet run --project tests/Golden -c Release --no-build -- verify tests/Golden/data --only simulation

  search:
    name: Search regression shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tests/Golden -c Release
      - run: dotnet run --project tests/Golden -c Release --no-build -- verify tests/Golden/data --only search --shard ${{ matrix.shard }}/4
